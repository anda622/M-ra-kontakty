<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: Roboto, Arial, sans-serif; font-size: 13px; color: #202124; margin: 12px; }
      h2 { font-size: 15px; margin: 0 0 2px; }
      .muted { color: #5f6368; font-size: 12px; }
      .card { background: #f8f9fa; border: 1px solid #dadce0; border-radius: 6px; padding: 10px; margin-bottom: 12px; }
      label { display: block; font-weight: 500; margin: 10px 0 4px; }
      select, textarea {
        width: 100%; box-sizing: border-box; font-family: inherit; font-size: 13px;
        border: 1px solid #dadce0; border-radius: 4px; padding: 6px;
      }
      textarea { height: 180px; resize: vertical; }
      .send {
        display: block; text-align: center; background: #25d366; color: #fff; font-weight: 600;
        text-decoration: none; padding: 10px; border-radius: 4px; margin-top: 12px;
      }
      .send.disabled { background: #dadce0; color: #80868b; pointer-events: none; }
      button.secondary {
        width: 100%; margin-top: 8px; padding: 8px; background: #fff;
        border: 1px solid #dadce0; border-radius: 4px; cursor: pointer;
      }
      .row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
      .row .muted { white-space: nowrap; }
      .warn { color: #c5221f; }
      .ok { color: #188038; }
      .progress { margin-top: 10px; text-align: center; }
      .bar { height: 4px; background: #e8eaed; border-radius: 2px; margin-top: 4px; overflow: hidden; }
      .bar span { display: block; height: 100%; background: #25d366; }
    </style>
  </head>
  <body>
    <div class="card">
      <h2 id="name">Načítám…</h2>
      <div class="muted" id="phone"></div>
      <div class="muted" id="meta"></div>
    </div>

    <label for="template">Šablona</label>
    <select id="template"></select>

    <label for="message">Zpráva</label>
    <textarea id="message"></textarea>

    <a id="send" class="send disabled" target="_blank" rel="noopener">Otevřít WhatsApp</a>
    <button class="secondary" id="next">Další nekontaktovaný ▸</button>
    <button class="secondary" id="refresh">Načíst vybraný řádek</button>
    <div class="progress muted" id="progress"></div>

    <div class="row">
      <span class="muted">Otevírat v:</span>
      <select id="target">
        <option value="web">WhatsApp Web</option>
        <option value="app">aplikaci (wa.me)</option>
      </select>
    </div>

    <div class="muted" id="status" style="margin-top:8px;"></div>

    <script>
      var templates = [];
      var contact = null;
      var target = 'web';

      function el(id) { return document.getElementById(id); }

      function loadSettings() {
        google.script.run.withSuccessHandler(function (settings) {
          templates = settings.templates;
          target = settings.target;
          el('target').value = target;

          var select = el('template');
          select.innerHTML = '';
          templates.forEach(function (template, index) {
            var option = document.createElement('option');
            option.value = String(index);
            option.textContent = template.name;
            select.appendChild(option);
          });
          applyTemplate();
        }).getPanelSettings();
      }

      function applyTemplate() {
        if (!templates.length || !contact) return;
        var template = templates[Number(el('template').value) || 0];
        google.script.run.withSuccessHandler(function (text) {
          el('message').value = text;
          updateLink();
        }).renderTemplate(template.body, contact);
      }

      function updateLink() {
        var link = el('send');
        if (!contact || !contact.phoneValid) {
          link.className = 'send disabled';
          link.removeAttribute('href');
          return;
        }
        google.script.run.withSuccessHandler(function (url) {
          link.href = url;
          link.className = 'send';
        }).buildLink(contact.phone, el('message').value, target);
      }

      function showProgress(progress) {
        var box = el('progress');
        if (!progress || !progress.total) {
          box.innerHTML = '';
          return;
        }
        var percent = Math.round((progress.done / progress.total) * 100);
        box.innerHTML =
          'Kontaktováno ' + progress.done + ' z ' + progress.total +
          '<div class="bar"><span style="width:' + percent + '%"></span></div>';
      }

      function showSelection(data, force) {
        if (!data.ok) {
          el('name').textContent = '—';
          el('phone').innerHTML = '<span class="warn">' + data.error + '</span>';
          el('meta').textContent = '';
          contact = null;
          updateLink();
          return;
        }
        showProgress(data.progress);
        // Rebuild the message only when a different row was selected, so your
        // edits are not thrown away by the polling below.
        var changed = !contact || contact.row !== data.row;
        contact = data;
        el('name').textContent = data.name || '(bez jména)';
        el('phone').innerHTML = data.phoneValid
          ? '+' + data.phone + ' <span class="muted">(řádek ' + data.row + ')</span>'
          : '<span class="warn">Neplatné číslo: ' + (data.rawPhone || 'prázdné') + '</span>';
        el('meta').textContent = [
          data.status ? 'Stav: ' + data.status : '',
          data.sentAt ? 'Odesláno: ' + data.sentAt : ''
        ].filter(Boolean).join(' · ');

        if (changed || force) {
          el('status').textContent = '';
          applyTemplate();
        } else {
          updateLink();
        }
      }

      function refresh(force) {
        google.script.run.withSuccessHandler(function (data) {
          showSelection(data, force);
        }).getSelection();
      }

      el('template').addEventListener('change', applyTemplate);
      el('message').addEventListener('input', updateLink);
      el('refresh').addEventListener('click', function () { refresh(true); });

      el('next').addEventListener('click', function () {
        el('status').textContent = 'Hledám…';
        google.script.run.withSuccessHandler(function (data) {
          el('status').textContent = '';
          showSelection(data, true);
        }).goToNextUncontacted();
      });

      el('target').addEventListener('change', function () {
        target = el('target').value;
        google.script.run.saveLinkTarget(target);
        updateLink();
      });

      el('send').addEventListener('click', function () {
        if (!contact) return;
        google.script.run.withSuccessHandler(function (stamp) {
          el('status').innerHTML = '<span class="ok">Označeno jako odesláno ' + stamp + '</span>';
          refresh(false);
        }).markSent(contact.row);
      });

      loadSettings();
      refresh(true);
      // Follow the row you click in the sheet.
      setInterval(function () { refresh(false); }, 2000);
    </script>
  </body>
</html>
